# Shared CLI: gem install native-packages --version 0.9.0
---
schema: 1
tool:
  version: 0.9.0
  nfpm: 2.47.0
# The ALSA t64 package also provides this runtime library.
libraries:
  libasound.so.2:
    deb: libasound2
    rpm: alsa-lib
nfpm:
  name: zap-fastest
  maintainer: eternalwaitt
  homepage: https://github.com/SSParzival/zap-fastest
  description: Fast native WhatsApp client
  license: MIT
  provides: [zap-fastest, zap-faster]
  conflicts: [zap-faster, zapfast, fastsapp]
  replaces: [zap-faster]
  contents:
  - src: "@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/zap-fastest"
    dst: "/usr/bin/zap-fastest"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/zap-fastest/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/zap-fastest/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/packaging/applications/zap-fastest.desktop"
    dst: "/usr/share/applications/zap-fastest.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/packaging/icons/zap-fastest.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/zap-fastest.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/zap-fastest.json.tpl
    dst: /usr/share/zap-fastest/omarchy/zap-fastest.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/zap-fastest-theme
    dst: /usr/share/zap-fastest/omarchy/zap-fastest-theme
    file_info:
      mode: 493
  # native-packages adds the C library (libc6, glibc) at the version the
  # binary needs: 2.36, as the release builds run in Debian 12.
  overrides:
    deb:
      depends:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2
      - libasound2-plugins
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'zap-fastest-@TAG@-macos-universal.dmg'
  windows-amd64:
    platform: windows
    arch: amd64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-x86_64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zap-fastest-@TAG@-x86_64-pc-windows-msvc.msi'
  windows-arm64:
    platform: windows
    arch: arm64
    formats: [msi]
    input:
      kind: directory
      local: dist/windows-input-aarch64-pc-windows-msvc
    native:
      command: [ruby, packaging/windows/msi.rb, '@PAYLOAD@', '@PACKAGE@', '@VERSION@']
      output: 'zap-fastest-@TAG@-aarch64-pc-windows-msvc.msi'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    after_package: [python3, packaging/linux-finalize.py, '@FORMAT@', '@PACKAGE@', '@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/zap-fastest', '@ARCH@']
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zap-fastest-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: zap-fastest-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    after_package: [python3, packaging/linux-finalize.py, '@FORMAT@', '@PACKAGE@', '@PAYLOAD@/zap-fastest-v@VERSION@-@TARGET@/zap-fastest', '@ARCH@']
    formats:
    - deb
    - rpm
    - appimage
    input:
      local: dist/zap-fastest-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: zap-fastest-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: SSParzival/zap-fastest
  checksums: checksums.txt
  prereleases: true
assets:
  AMD64:
    file: zap-fastest-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/zap-fastest-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: zap-fastest-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/zap-fastest-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: zap-fastest-v@VERSION@-macos-universal.dmg
    local: dist/zap-fastest-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: zap-fastest-@VERSION@.tar.gz
    url: https://github.com/SSParzival/zap-fastest/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zap-fastest-@VERSION@.tar.gz
templates:
  homebrew/zap-fastest.rb: packaging/homebrew/zap-fastest.rb.in
  arch/zap-fastest/PKGBUILD: packaging/arch/zap-fastest/PKGBUILD.in
  arch/zap-fastest/zap-fastest.install: packaging/arch/zap-fastest.install
  arch/zap-fastest-bin/PKGBUILD: packaging/arch/zap-fastest-bin/PKGBUILD.in
  arch/zap-fastest-bin/zap-fastest-bin.install: packaging/arch/zap-fastest.install
  arch/zap-fastest-git/PKGBUILD: packaging/arch/zap-fastest-git/PKGBUILD.in
  arch/zap-fastest-git/zap-fastest-git.install: packaging/arch/zap-fastest.install
version_file: Cargo.toml
