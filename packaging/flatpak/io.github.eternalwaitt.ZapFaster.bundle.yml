# The release workflow's Flatpak: the binary the Linux job built, packaged
# into the same sandbox as io.github.eternalwaitt.ZapFaster.yml describes. The
# job unpacks the release tarball into built/ beside this file first.
id: io.github.eternalwaitt.ZapFaster
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: zap-fastest
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  # Archive encryption key.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --persist=.local/state
modules:
  - name: zap-fastest
    buildsystem: simple
    build-commands:
      - bin="zap-fastest"; install -Dm755 "$bin" /app/bin/zap-fastest
      - desktop="packaging/applications/zap-fastest.desktop"; install -Dm644 "$desktop" /app/share/applications/io.github.eternalwaitt.ZapFaster.desktop
      - sed -i 's/^Icon=.*$/Icon=io.github.eternalwaitt.ZapFaster/;s/^StartupWMClass=zap-fast\(est\|er\)$/StartupWMClass=io.github.eternalwaitt.ZapFaster/' /app/share/applications/io.github.eternalwaitt.ZapFaster.desktop
      - install -Dm644 packaging/icons/zap-fastest.svg /app/share/icons/hicolor/scalable/apps/io.github.eternalwaitt.ZapFaster.svg
      - install -Dm644 packaging/flatpak/io.github.eternalwaitt.ZapFaster.metainfo.xml /app/share/metainfo/io.github.eternalwaitt.ZapFaster.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/zap-fastest/LICENSE
    sources:
      - type: dir
        path: built
      # Metainfo belongs to this packaging checkout, not the portable archive.
      - type: file
        path: io.github.eternalwaitt.ZapFaster.metainfo.xml
        dest: packaging/flatpak
