name: Packaging

on:
  push:
    branches: [main]
    paths:
      - packaging/arch/**
      - packaging/applications/**
      - packaging/icons/**
      - packaging/install-user.sh
      - packaging/test-install-user.sh
      - packaging/test-icon-qt.py
      - contrib/omarchy/**
      - .github/workflows/packaging.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - packaging/arch/**
      - packaging/applications/**
      - packaging/icons/**
      - packaging/install-user.sh
      - packaging/test-install-user.sh
      - packaging/test-icon-qt.py
      - contrib/omarchy/**
      - .github/workflows/packaging.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cachyos-packaging:
    name: CachyOS / Arch Linux packaging checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Arch PKGBUILD templates and install hooks
        run: |
          bash -n packaging/arch/zap-fastest/PKGBUILD.in
          bash -n packaging/arch/zap-fastest-bin/PKGBUILD.in
          bash -n packaging/arch/zap-fastest-git/PKGBUILD.in
          bash -n packaging/arch/zap-fastest.install
          bash -n packaging/install-user.sh
          bash -n contrib/omarchy/zap-fastest-theme
      - name: Test user installer with special paths
        run: bash packaging/test-install-user.sh
      - name: Check desktop SVG compatibility with Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pyqt5 python3-pyqt5.qtsvg libqt5svg5
          python3 packaging/test-icon-qt.py
      - name: Test zap-fastest-bin Arch package build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          work="$RUNNER_TEMP/arch-pkg-check"
          stage="$work/stage/zap-fastest-v${version}-x86_64-unknown-linux-gnu"
          mkdir -p "$stage" "$work/input" "$work/output"
          printf '#!/bin/sh\necho "zap-fastest %s"\n' "$version" > "$stage/zap-fastest"
          chmod +x "$stage/zap-fastest"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zap-fastest-portable.txt "$stage/"
          cp --parents packaging/applications/zap-fastest.desktop packaging/icons/zap-fastest.svg \
            contrib/omarchy/zap-fastest.json.tpl contrib/omarchy/zap-fastest-theme "$stage/"
          tarball="zap-fastest-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar czf "$work/input/$tarball" -C "$work/stage" "zap-fastest-v${version}-x86_64-unknown-linux-gnu"
          sha=$(sha256sum "$work/input/$tarball" | awk '{print $1}')
          sed -e "s/@VERSION@/${version}/g" -e "s/@PKGREL@/1/g" -e "s/@AMD64_SHA256@/${sha}/g" \
            packaging/arch/zap-fastest-bin/PKGBUILD.in > "$work/input/PKGBUILD"
          cp packaging/arch/zap-fastest.install "$work/input/zap-fastest-bin.install"
          docker run --rm --ulimit nofile=1024:524288 \
            -v "$work/input:/input:ro" \
            -v "$work/output:/output" \
            archlinux:base-devel bash -euo pipefail -c '
              useradd -m builder
              mkdir -p /home/builder/build
              cp -a /input/. /home/builder/build/
              chown -R builder:builder /home/builder/build
              su - builder -c "cd /home/builder/build && PKGEXT=.pkg.tar.zst PACKAGER=\"ZapFastest <https://github.com/SSParzival/zap-fastest>\" makepkg -df --noconfirm"
              pkg=(/home/builder/build/zap-fastest-bin-*-x86_64.pkg.tar.zst)
              test "${#pkg[@]}" -eq 1
              pacman -Qip "${pkg[0]}"
              files=$(pacman -Qlp "${pkg[0]}")
              echo "$files"
              grep -q " /usr/bin/zap-fastest$" <<< "$files"
              grep -q " /usr/share/applications/zap-fastest.desktop$" <<< "$files"
              grep -q " /usr/share/icons/hicolor/scalable/apps/zap-fastest.svg$" <<< "$files"
              grep -q " /usr/share/zap-fastest/omarchy/zap-fastest.json.tpl$" <<< "$files"
              grep -q " /usr/share/zap-fastest/omarchy/zap-fastest-theme$" <<< "$files"
            '
