name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  release-source:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already on origin/main." >&2
            exit 1
          fi

  build:
    name: build (x86_64-unknown-linux-gnu)
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    # Built in Debian 12 so the binary links against glibc 2.36 and statically
    # embeds libwebp, keeping it portable across CachyOS/Arch rolling updates.
    container: debian:12
    steps:
      - name: GUI build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libpipewire-0.3-dev clang libclang-dev cmake perl
      - uses: actions/checkout@v7
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: rustup target add x86_64-unknown-linux-gnu
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package
        shell: bash
        run: |
          name="zap-fastest-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name"
          cp "target/x86_64-unknown-linux-gnu/release/zap-fastest" "dist/$name/zap-fastest"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zap-fastest-portable.txt "dist/$name/"
          cp --parents packaging/applications/zap-fastest.desktop packaging/icons/zap-fastest.svg \
            contrib/omarchy/zap-fastest.json.tpl contrib/omarchy/zap-fastest-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      - name: Attest Linux tarball
        uses: crmne/native-packages/.github/actions/attest@83bd46c245488c2b8f1b9d74569e16cf6a449e8f # v0.9.0
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist/*.tar.gz
          if-no-files-found: error

  arch-package:
    name: CachyOS / Arch package (x86_64)
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Build zap-fastest-bin pacman package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkgver="${version//-/_}"
          tarball="zap-fastest-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          work="$RUNNER_TEMP/arch-pkg"
          mkdir -p "$work/input" "$work/output"
          cp "dist/$tarball" "$work/input/"
          sha=$(sha256sum "$work/input/$tarball" | awk '{print $1}')
          sed -e "s/@VERSION@/${pkgver}/g" -e "s/@PKGREL@/1/g" -e "s/@AMD64_SHA256@/${sha}/g" \
            packaging/arch/zap-fastest-bin/PKGBUILD.in > "$work/input/PKGBUILD"
          if [ "$pkgver" != "$version" ]; then
            sed -i "s/v\${pkgver}/${GITHUB_REF_NAME}/g" "$work/input/PKGBUILD"
          fi
          cp packaging/arch/zap-fastest.install "$work/input/zap-fastest-bin.install"
          docker run --rm --ulimit nofile=1024:524288 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$work/input:/input:ro" \
            -v "$work/output:/output" \
            archlinux:base-devel bash -euo pipefail -c '
              useradd -m builder
              mkdir -p /home/builder/build
              cp -a /input/. /home/builder/build/
              chown -R builder:builder /home/builder/build
              su - builder -c "cd /home/builder/build && PKGEXT=.pkg.tar.zst PACKAGER=\"ZapFastest <https://github.com/SSParzival/zap-fastest>\" makepkg -df --noconfirm"
              pkg=(/home/builder/build/zap-fastest-bin-*-x86_64.pkg.tar.zst)
              test "${#pkg[@]}" -eq 1
              pacman -Qip "${pkg[0]}"
              files=$(pacman -Qlp "${pkg[0]}")
              echo "$files"
              grep -q " /usr/bin/zap-fastest$" <<< "$files"
              grep -q " /usr/share/applications/zap-fastest.desktop$" <<< "$files"
              grep -q " /usr/share/icons/hicolor/scalable/apps/zap-fastest.svg$" <<< "$files"
              grep -q " /usr/share/zap-fastest/omarchy/zap-fastest.json.tpl$" <<< "$files"
              grep -q " /usr/share/zap-fastest/omarchy/zap-fastest-theme$" <<< "$files"
              cp "${pkg[0]}" /output/
              chown "$HOST_UID:$HOST_GID" /output/*.pkg.tar.zst
              chmod 644 /output/*.pkg.tar.zst
            '
          mkdir -p dist/arch
          cp "$work/output/"*.pkg.tar.zst dist/arch/
      - name: Attest Arch package
        uses: crmne/native-packages/.github/actions/attest@83bd46c245488c2b8f1b9d74569e16cf6a449e8f # v0.9.0
        with:
          subject-path: dist/arch/*.pkg.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: dist/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [build, arch-package]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=10" \
              --jq '.workflow_runs[0] | if . == null then "missing" else .status + ":" + (.conclusion // "") end')
            echo "CI for $GITHUB_SHA: $state"
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "Release source CI did not pass." >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "Timed out waiting for release source CI." >&2
          exit 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '4.0'
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@83bd46c245488c2b8f1b9d74569e16cf6a449e8f # v0.9.0
        with:
          directory: dist
          public-key: assets/update-public-key.hex
          key-env: ZAPFASTER_UPDATE_SIGNING_KEY
        env:
          ZAPFASTER_UPDATE_SIGNING_KEY: ${{ secrets.ZAPFASTER_UPDATE_SIGNING_KEY }}
      # Publish the reviewed notes committed before the tag, never a
      # generated summary. A stable tag without them stops here; a
      # prerelease without them gets a short placeholder.
      - name: Release notes
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Prerelease build of ZapFastest ${GITHUB_REF_NAME}." > release-notes.md
          else
            echo "::error::Write $notes and push it before tagging a stable release."
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: ZapFastest ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
