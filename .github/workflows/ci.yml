name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit all locked dependencies
        run: cargo audit

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl libclang-dev
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: quality-v1
      - name: Dependency sources
        run: python3 .github/scripts/check-dependency-sources.py
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: mbx clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: mbx doc --locked --all-features --no-deps

  test:
    name: test (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libasound2-dev cmake perl libclang-dev xvfb xauth libgl1-mesa-dri libegl1
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # The demo feature carries the headless layout test of every screen.
      - name: Tests (default features)
        run: mbx test --locked --all-targets
      - name: Tests (all features)
        run: mbx test --locked --all-targets --all-features
      - name: Build Linux demo
        run: mbx build --locked --features demo
      - name: Linux native window smoke test
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          XDG_RUNTIME_DIR: ${{ runner.temp }}/zap-fastest-demo-runtime
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          bin="target/debug/zap-fastest"
          for page in media-album forward-review voice-transcript starred star-menu pinned background-history original-documents international-sender; do
            timeout 45s xvfb-run -a -s "-screen 0 1600x1200x24" \
              env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET \
              "$bin" --demo --demo-page "$page" \
              --demo-shot "$RUNNER_TEMP/zap-fastest-$page.png" --demo-shot-delay 2500 \
              > "$RUNNER_TEMP/zap-fastest-$page.log" 2>&1
            test -s "$RUNNER_TEMP/zap-fastest-$page.png"
          done
      - name: Linux preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-preview
          path: |
            ${{ runner.temp }}/zap-fastest-*.png
            ${{ runner.temp }}/zap-fastest-*.log
